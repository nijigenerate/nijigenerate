# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
name: Nightly

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:


permissions:
  contents: write

jobs:
  build-resources:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v3
    
    - name: 'Install dependencies'
      run: |
        sudo apt-get update
        sudo apt-get install gettext
        mkdir out/

    - name: 'Generate i18n'
      run: |
        # Build translations
        mkdir otl/
        
        sudo chmod +x ./gentl.sh
        ./gentl.sh

        cp out/* otl/

    - name: Make Artifact
      uses: actions/upload-artifact@v4
      with:
        name: translations
        path: otl/*
        retention-days: 1

  linux-zip:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v3
    - uses: dlang-community/setup-dlang@4c99aa991ce7d19dd3064de0a4f2f6b2f152e2d7
      with:
        compiler: ldc-1.41.0

    - name: Setup cmake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.31'
    
    - name: CMake version
      run: cmake --version
      
    - name: "Get build dependencies"
      run: |
        sudo apt-get update
        sudo apt install libsdl2-dev libfreetype6-dev gettext

    - name: 'Generate i18n'
      run: |
        sudo chmod +x ./gentl.sh
        ./gentl.sh
      
    - name: "Clone dependencies & set versions"
      shell: bash
      timeout-minutes: 10
      run: bash ./build-aux/clone-ci-dependencies.sh

    - name: 'Build nijigenerate'
      run: |
        # Build metadata (like version information and icons)
        dub build --config=meta

        # Build the project, with its main file included, without unittests
        dub build --compiler=ldc2 --config=linux-nightly
          
    - name: Archive Zip
      uses: thedoctor0/zip-release@main
      with:
        type: 'zip'
        filename: 'nijigenerate-linux-x86_64.zip'
        directory: 'out/'
        path: '*'

    - name: Release to nightly tag
      uses: softprops/action-gh-release@v1
      with:
        name: 'Nightly Build'
        tag_name: nightly
        files: |
          out/nijigenerate-linux-x86_64.zip
        generate_release_notes: true

  windows:
    # i2d-imgui 0.8.0 invokes CMake with the Visual Studio 17 2022 generator.
    runs-on: windows-2022
    needs: build-resources

    steps:
    - uses: actions/checkout@v3
    - uses: dlang-community/setup-dlang@4c99aa991ce7d19dd3064de0a4f2f6b2f152e2d7
      with:
        compiler: ldc-1.41.0
        
    - name: Download translations
      uses: actions/download-artifact@v4
      with:
        name: translations
        path: out/i18n/
      
    - name: "Clone dependencies & set versions"
      shell: bash
      timeout-minutes: 10
      run: bash ./build-aux/clone-ci-dependencies.sh

    - name: Setup cmake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.31'
    
    - name: CMake version
      run: cmake --version

    - name: 'Build nijigenerate'
      run: |
        function Invoke-VSDevEnvironment {
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            $installationPath = & $vswhere -prerelease -legacy -latest -property installationPath
            $Command = Join-Path $installationPath "Common7\Tools\vsdevcmd.bat"
          & "${env:COMSPEC}" /s /c "`"$Command`" -no_logo && set" | Foreach-Object {
                if ($_ -match '^([^=]+)=(.*)') {
                    [System.Environment]::SetEnvironmentVariable($matches[1], $matches[2])
                }
            }
        }
        Invoke-VSDevEnvironment
        Remove-Item 'C:/Strawberry' -Recurse

        # Build metadata (like version information and icons)
        dub build --config=meta

        # Build the project, with its main file included, without unittests
        dub build --compiler=ldc2 --config=win32-nightly

    - name: Archive Zip
      uses: thedoctor0/zip-release@main
      with:
        type: 'zip'
        filename: 'nijigenerate-win32-x86_64.zip'
        directory: 'out/'
        path: '*'

    - name: 'Add msbuild to PATH'
      uses: microsoft/setup-msbuild@v1.1
    
    - name: 'Build MSI'
      run: |
        cd build-aux/windows/wix

        # Install required dependency
        mkdir packages/
        nuget install WixToolset.UI.wixext -version 4.0.0 -OutputDirectory packages/

        # Build solution
        msbuild "nijigenerate.sln" -property:Configuration=Release

        # Copy installer out
        mv "bin/Release/nijigenerate.msi" "../../../out/nijigenerate-win32-x86_64.msi"
        cd ../../../

    - name: 'Release to nightly tag'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: nightly
        files: |
          out/nijigenerate-win32-x86_64.msi
          out/nijigenerate-win32-x86_64.zip

  macOS-dmg:
    # Preserve the ARM64 app and native /opt/homebrew dependencies.
    runs-on: macos-15
    env:
      # Keep the previous runner's deployment floor for CMake-built libraries.
      MACOSX_DEPLOYMENT_TARGET: '14.0'

    steps:
    - uses: actions/checkout@v3
    - uses: dlang-community/setup-dlang@v1.4.0
      with:
        compiler: ldc-1.41.0
  
    - name: "Prepare for DMG packing"
      run: |
        export HOMEBREW_NO_INSTALL_CLEANUP=1
        export HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1
        brew update
        brew install create-dmg gettext openssl@3
        # Deimos detects the binding ABI through pkg-config, then the openssl CLI.
        echo "/opt/homebrew/opt/openssl@3/bin" >> "$GITHUB_PATH"
        echo "PKG_CONFIG_PATH=/opt/homebrew/opt/openssl@3/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

    - name: "Remove conflicting brew packages"
      continue-on-error: true
      run: |
        # Remove conflicting brew items
        brew remove --ignore-dependencies libpng brotli harfbuzz

    - name: "Remove final conflicting files"
      continue-on-error: true
      run: |
        # Delete fake harfbuzz if need be
        if [ -f "/usr/local/lib/libharfbuzz.dylib" ]; then
          sudo rm -r /usr/local/lib/libharfbuzz.dylib
        fi

        # And the .a for it as well
        if [ -f "/usr/local/lib/libharfbuzz.a" ]; then
          sudo rm -r /usr/local/lib/libharfbuzz.a
        fi

    - name: 'Generate i18n'
      run: |
        sudo chmod +x ./gentl.sh
        ./gentl.sh
      
    - name: "Clone dependencies & set versions"
      shell: bash
      timeout-minutes: 10
      run: bash ./build-aux/clone-ci-dependencies.sh

    - name: Setup cmake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.31'
    
    - name: 'Verify macOS build prerequisites'
      run: |
        test "$(uname -m)" = arm64
        test "$(brew --prefix)" = /opt/homebrew
        xcrun --find clang
        xcrun --show-sdk-path
        ldc2 --version
        dub --version
        cmake --version
        command -v create-dmg
        command -v msgfmt
        test -f /opt/homebrew/opt/openssl@3/lib/libssl.dylib
        test -f /opt/homebrew/opt/openssl@3/lib/libcrypto.dylib
        openssl version
        case "$(pkg-config --modversion openssl)" in
          3.*) ;;
          *) echo "OpenSSL bindings must detect the linked OpenSSL 3 ABI" >&2; exit 1 ;;
        esac

    - name: 'Build nijigenerate'
      env:
        DFLAGS: "-g -force-dwarf-frame-section=false"
      run: |

        # Build metadata (like version information and icons)
        dub build --config=meta

        # Build ARM64 version only
        echo "Building arm64 binary..."
        dub build --config=osx-nightly --arch=arm64-apple-macos
        
        # Bundle app
        echo "Bundling app..."
        ./build-aux/osx/osxbundle.sh

    - name: 'Verify macOS bundle'
      run: |
        app=out/nijigenerate.app/Contents
        test -s "$app/MacOS/nijigenerate"
        test -s "$app/Info.plist"
        test -s "$app/Frameworks/libSDL2.dylib"
        test -s "$app/Frameworks/libfreetype.dylib"
        test -s "$app/Frameworks/cimgui.dylib"
        for binary in "$app/MacOS/nijigenerate" "$app/Frameworks/"*.dylib; do
          lipo -verify_arch arm64 "$binary"
          otool -L "$binary"
        done

    - name: 'Build DMG'
      run: |
        ./build-aux/osx/gendmg.sh
        test -s out/Install_nijigenerate.dmg
        hdiutil verify out/Install_nijigenerate.dmg

    - name: Release to nightly tag
      uses: softprops/action-gh-release@v1
      with:
        name: 'Nightly Build'
        tag_name: nightly
        files: 'out/Install_nijigenerate.dmg'
