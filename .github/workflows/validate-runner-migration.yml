# Temporary validation of the runner migration; no release or tag writes.
name: Validate runner migration
on:
  push:
    branches: [main]
    paths: [.github/workflows/validate-runner-migration.yml]
permissions:
  contents: read
jobs:
  macOS-dmg:
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
    - uses: actions/checkout@v3
      with:
        ref: f0de096c9e7470adeb581a3f7fcd9f7df66b3ba8
    - uses: dlang-community/setup-dlang@v1.4.0
      with:
        compiler: ldc-1.41.0
    - name: Prepare for DMG packing
      run: 'export HOMEBREW_NO_INSTALL_CLEANUP=1

        export HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1

        brew update

        brew install create-dmg gettext openssl@3

        # Deimos detects the binding ABI through pkg-config, then the openssl CLI.

        echo "/opt/homebrew/opt/openssl@3/bin" >> "$GITHUB_PATH"

        echo "PKG_CONFIG_PATH=/opt/homebrew/opt/openssl@3/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

        '
    - name: Remove conflicting brew packages
      continue-on-error: true
      run: '# Remove conflicting brew items

        brew remove --ignore-dependencies libpng brotli harfbuzz

        '
    - name: Remove final conflicting files
      continue-on-error: true
      run: "# Delete fake harfbuzz if need be\nif [ -f \"/usr/local/lib/libharfbuzz.dylib\" ]; then\n  sudo rm -r /usr/local/lib/libharfbuzz.dylib\n\
        fi\n\n# And the .a for it as well\nif [ -f \"/usr/local/lib/libharfbuzz.a\" ]; then\n  sudo rm -r /usr/local/lib/libharfbuzz.a\n\
        fi\n"
    - name: Generate i18n
      run: 'sudo chmod +x ./gentl.sh

        ./gentl.sh

        '
    - name: Clone dependencies & set versions
      shell: bash
      timeout-minutes: 10
      run: bash ./build-aux/clone-ci-dependencies.sh
    - name: Setup cmake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.31'
    - name: Verify macOS build prerequisites
      run: "test \"$(uname -m)\" = arm64\ntest \"$(brew --prefix)\" = /opt/homebrew\nxcrun --find clang\nxcrun --show-sdk-path\n\
        ldc2 --version\ndub --version\ncmake --version\ncommand -v create-dmg\ncommand -v msgfmt\ntest -f /opt/homebrew/opt/openssl@3/lib/libssl.dylib\n\
        test -f /opt/homebrew/opt/openssl@3/lib/libcrypto.dylib\nopenssl version\ncase \"$(pkg-config --modversion openssl)\"\
        \ in\n  3.*) ;;\n  *) echo \"OpenSSL bindings must detect the linked OpenSSL 3 ABI\" >&2; exit 1 ;;\nesac\n"
    - name: Build nijigenerate
      env:
        DFLAGS: -g -force-dwarf-frame-section=false
      run: '

        # Build metadata (like version information and icons)

        dub build --config=meta


        # Build ARM64 version only

        echo "Building arm64 binary..."

        dub build --config=osx-nightly --arch=arm64-apple-macos


        # Bundle app

        echo "Bundling app..."

        ./build-aux/osx/osxbundle.sh

        '
    - name: Verify macOS bundle
      run: "app=out/nijigenerate.app/Contents\ntest -s \"$app/MacOS/nijigenerate\"\ntest -s \"$app/Info.plist\"\ntest -s \"\
        $app/Frameworks/libSDL2.dylib\"\ntest -s \"$app/Frameworks/libfreetype.dylib\"\ntest -s \"$app/Frameworks/cimgui.dylib\"\
        \nfor binary in \"$app/MacOS/nijigenerate\" \"$app/Frameworks/\"*.dylib; do\n  lipo -verify_arch arm64 \"$binary\"\
        \n  otool -L \"$binary\"\ndone\n"
    - name: Build DMG
      run: './build-aux/osx/gendmg.sh

        test -s out/Install_nijigenerate.dmg

        hdiutil verify out/Install_nijigenerate.dmg

        '
    timeout-minutes: 30
