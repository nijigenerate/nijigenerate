      run: "# Delete fake harfbuzz if need be\nif [ -f \"/usr/local/lib/libharfbuzz.dylib\" ]; then\n  sudo rm -r /usr/local/lib/libharfbuzz.dylib\n\
        fi\n\n# And the .a for it as well\nif [ -f \"/usr/local/lib/libharfbuzz.a\" ]; then\n  sudo rm -r /usr/local/lib/libharfbuzz.a\n\
        fi\n"
    - name: Generate i18n
      run: 'sudo chmod +x ./gentl.sh

        ./gentl.sh

        '
    - name: Clone dependencies & set versions
      shell: bash
      timeout-minutes: 10
      run: bash ./build-aux/clone-ci-dependencies.sh
    - name: Setup cmake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.31'
    - name: Verify macOS build prerequisites
      run: 'test "$(uname -m)" = arm64

        test "$(brew --prefix)" = /opt/homebrew

        xcrun --find clang

        xcrun --show-sdk-path

        ldc2 --version

        dub --version

        cmake --version

        command -v create-dmg

        command -v msgfmt

        test -f /opt/homebrew/opt/openssl@3/lib/libssl.dylib

        test -f /opt/homebrew/opt/openssl@3/lib/libcrypto.dylib

        '
    - name: Build nijigenerate
      env:
        DFLAGS: -force-dwarf-frame-section=false
      run: '# Build metadata (like version information and icons)

        dub build --config=meta


        # Build ARM64 version only

        echo "Building arm64 binary..."

        dub build --build=release --config=osx-full --arch=arm64-apple-macos


        # Bundle app

        echo "Bundling app..."

        ./build-aux/osx/osxbundle.sh

        '
    - name: Verify macOS bundle
      run: "app=out/nijigenerate.app/Contents\ntest -s \"$app/MacOS/nijigenerate\"\ntest -s \"$app/Info.plist\"\ntest -s \"\
        $app/Frameworks/libSDL2.dylib\"\ntest -s \"$app/Frameworks/libfreetype.dylib\"\ntest -s \"$app/Frameworks/cimgui.dylib\"\
        \nfor binary in \"$app/MacOS/nijigenerate\" \"$app/Frameworks/\"*.dylib; do\n  lipo -verify_arch arm64 \"$binary\"\
        \n  otool -L \"$binary\"\ndone\n"
    - name: Archive Zip
      uses: thedoctor0/zip-release@main
      with:
        type: zip
        filename: nijigenerate-macOS.zip
        directory: out/
        path: '*'
    - name: Build DMG
      run: './build-aux/osx/gendmg.sh

        test -s out/Install_nijigenerate.dmg

        hdiutil verify out/Install_nijigenerate.dmg

        '
    - name: Make Artifact of build
      uses: actions/upload-artifact@v4
      with:
        name: release-osx
        path: 'out/nijigenerate-macOS.zip

          out/Install_nijigenerate.dmg

          version.txt

          '
        retention-days: 1
    - name: Verify release ZIP
      run: 'test -s out/nijigenerate-macOS.zip

        unzip -t out/nijigenerate-macOS.zip'
    timeout-minutes: 30
  macos-candidate:
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
    - uses: actions/checkout@v3
      with:
        ref: aa4f7b054870a107a929a63744e9771f48d7475f
    - uses: dlang-community/setup-dlang@v1.4.0
      with:
        compiler: ldc-1.41.0
